# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=InfluenceNet

# Default server port for main application
server.port=8080

# Instagram API Configuration
instagram.api.base-url=http://localhost:8081

# Active Profile
spring.profiles.active=local

### -----------------------------
