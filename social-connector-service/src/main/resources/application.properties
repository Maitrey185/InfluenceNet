spring.application.name=social-connector-service
server.port=8094

spring.config.import=optional:file:../.env,optional:file:.env

# Postgres
spring.datasource.url=${REMINDER_DB_URL:jdbc:postgresql://localhost:5432/influencenet}
spring.datasource.username=${REMINDER_DB_USERNAME:influencenet_user}
spring.datasource.password=${REMINDER_DB_PASSWORD:influencenet_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka (producer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

instagram.api.base-url=http://localhost:8081
# ============================================
# MONGODB
# ============================================
spring.data.mongodb.uri=mongodb://admin:admin_pass@localhost:27017/influencenet?authSource=admin
spring.data.mongodb.database=influencenet
spring.data.mongodb.auto-index-creation=true


# Logging
logging.level.org.springframework.kafka=INFO
