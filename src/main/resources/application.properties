## -----------------------------
## Disable Security Completely
## -----------------------------
#spring.security.enabled=false
#management.security.enabled=false
spring.security.debug=true

# ============================================
# POSTGRESQL DATABASE
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/influencenet
spring.datasource.username=influencenet_user
spring.datasource.password=influencenet_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
#
## Flyway Database Migration
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.schemas=influencenet

# ============================================
# MONGODB
# ============================================
spring.data.mongodb.uri=mongodb://admin:admin_pass@localhost:27017/influencenet?authSource=admin
spring.data.mongodb.database=influencenet
spring.data.mongodb.auto-index-creation=true

# ============================================
# REDIS
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis_pass
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Redis Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ============================================
# KAFKA
# ============================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer Configuration
spring.kafka.consumer.group-id=influencenet-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Listener
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3

# ============================================
# ELASTICSEARCH
# ============================================
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=60s

# ============================================
# NEO4J
# ============================================
spring.neo4j.uri=neo4j+s://d3207bb5.databases.neo4j.io
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=lJIK3BYzADFd8TV892GmCfln9WMI1lPE-oDFX-xmgq0
spring.neo4j.database=neo4j
spring.neo4j.connection.pool.max-connection-pool-size=50
spring.neo4j.connection.pool.connection-acquisition-timeout=60s


# ============================================
# ACTUATOR & MONITORING
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Health Check - Disabled for services not running
management.health.redis.enabled=false
management.health.mongo.enabled=false
management.health.db.enabled=false
management.health.elasticsearch.enabled=false
management.health.neo4j.enabled=false

# ============================================
# DISTRIBUTED TRACING (ZIPKIN)
# ============================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# Disable Zipkin if not available
management.tracing.enabled=false

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.project.InfluenceNet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# JACKSON JSON
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

