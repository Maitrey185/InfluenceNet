spring.application.name=collaboration-neo4j-service
server.port=8093

# Postgres (reuses monolith DB for now; can be isolated later)
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/influencenet}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:influencenet_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:influencenet_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:collaboration-neo4j-service}
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Delegate deserializers for ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Default type for JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.project.InfluenceNet.contracts.InfluencerPostContract.InfluencerNeo4jEvent


# Optional: load environment-style properties from a local .env file at repo root
spring.config.import=optional:file:.env

