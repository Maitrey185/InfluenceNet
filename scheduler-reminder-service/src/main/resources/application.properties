spring.application.name=scheduler-reminder-service
server.port=8087

spring.config.import=optional:file:../.env,optional:file:.env

# Postgres
spring.datasource.url=${REMINDER_DB_URL:jdbc:postgresql://localhost:5432/influencenet}
spring.datasource.username=${REMINDER_DB_USERNAME:influencenet_user}
spring.datasource.password=${REMINDER_DB_PASSWORD:influencenet_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka (producer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Logging
logging.level.org.springframework.kafka=INFO
